name: Build NewAsiaPDFStudio Windows Installer
on:
  workflow_dispatch:

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build portable Windows app
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --windowed --onedir --name NewAsiaPDFStudio --icon assets/newasia.ico --add-data 'assets;assets' --collect-all fitz app.py
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw 'Inno Setup missing' }
          & $iscc NewAsiaPDFStudio.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: NewAsiaPDFStudio-Windows-Setup
          path: installer_output/NewAsiaPDFStudio_Setup_3.2_Windows_x64.exe
          if-no-files-found: error
